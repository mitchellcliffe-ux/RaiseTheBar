# Recipe for the Xcode project. The build service runs XcodeGen on this file, so no Mac is needed to create the project.
name: RaiseTheBar
options:
  bundleIdPrefix: com.CHANGEME
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RaiseTheBar:
    type: application
    platform: iOS
    sources:
      - RaiseTheBarApp.swift
      - Models
      - Engine
      - Services
      - Views
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Raise The Bar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Raise The Bar reads your running workouts so it can fill in time, distance and heart rate for you. It never writes to Health.
    entitlements:
      path: Support/RaiseTheBar.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        # CHANGE THIS to your own bundle ID. It must match the one you register with Apple.
        PRODUCT_BUNDLE_IDENTIFIER: com.CHANGEME.raisethebar
        TARGETED_DEVICE_FAMILY: "1"
  RaiseTheBarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: RaiseTheBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.CHANGEME.raisethebar.tests
schemes:
  RaiseTheBar:
    build:
      targets:
        RaiseTheBar: all
        RaiseTheBarTests: [test]
    test:
      targets:
        - RaiseTheBarTests
